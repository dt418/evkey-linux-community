name: Build packages

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    name: Nix package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build package and both outputs
        run: nix build --no-link '.#packages.x86_64-linux.default^*'
      - name: Evaluate NixOS module
        run: |
          nix eval --impure --json --expr '
            let
              flake = builtins.getFlake (toString ./.);
              system = "x86_64-linux";
              evaluated = flake.inputs.nixpkgs.lib.nixosSystem {
                inherit system;
                modules = [
                  flake.nixosModules.default
                  ({ ... }: {
                    programs.fcitx5-evkey.enable = true;
                    programs.fcitx5-evkey.uinput.enable = true;
                  })
                ];
              };
            in {
              helperUser = evaluated.config.users.users.evkey-input.isSystemUser;
              hasUinputRule = flake.inputs.nixpkgs.lib.hasInfix "/bin/setfacl" evaluated.config.services.udev.extraRules;
            }
          '

  source:
    name: Source archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create corresponding source archive
        run: |
          git archive --format=tar.gz --prefix=fcitx5-evkey-1.0.0/ --output=fcitx5-evkey-1.0.0.tar.gz HEAD
          sha256sum fcitx5-evkey-1.0.0.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: |
            fcitx5-evkey-1.0.0.tar.gz
            SHA256SUMS
          if-no-files-found: error

  debian:
    name: Debian package (${{ matrix.image }})
    needs: source
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-24.04
            image: ubuntu:24.04
          - name: ubuntu-26.04
            image: ubuntu:26.04
          - name: debian-13
            image: debian:13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: source
          path: dist
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y devscripts dpkg-dev equivs
          mk-build-deps --install --remove --tool 'apt-get -y --no-install-recommends' packaging/debian/control
      - name: Build Debian packages
        run: |
          cp -a packaging/debian debian
          chmod +x debian/rules debian/*.postinst debian/*.postrm
          dpkg-buildpackage --build=binary --no-sign
          mkdir -p dist/deb
          cp ../fcitx5-evkey_*.deb ../fcitx5-evkey-uinput_*.deb dist/deb/
          sha256sum dist/deb/*.deb > dist/deb-SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.name }}
          path: |
            dist/deb/*.deb
            dist/deb-SHA256SUMS
          if-no-files-found: error

  fedora:
    name: Fedora package (${{ matrix.image }})
    needs: source
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fedora-43
            image: fedora:43
          - name: fedora-44
            image: fedora:44
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: source
          path: dist
      - name: Install build dependencies
        run: |
          dnf -y install dnf-plugins-core rpm-build
          dnf -y builddep packaging/rpm/fedora/fcitx5-evkey.spec
      - name: Build Fedora packages
        run: |
          rpmbuild -ba packaging/rpm/fedora/fcitx5-evkey.spec \
            --define "_sourcedir $(pwd)/dist" \
            --define "_topdir $(pwd)/build/rpmbuild"
          find build/rpmbuild/RPMS -name '*.rpm' -print0 | sort -z | xargs -0 sha256sum > rpm-SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.name }}
          path: |
            build/rpmbuild/RPMS/**/*.rpm
            rpm-SHA256SUMS
          if-no-files-found: error

  arch:
    name: Arch package
    needs: source
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: source
          path: dist
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git sudo
          useradd --create-home builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Build Arch packages
        run: |
          archive="$GITHUB_WORKSPACE/dist/fcitx5-evkey-1.0.0.tar.gz"
          checksum="$(cut -d ' ' -f 1 "$GITHUB_WORKSPACE/dist/SHA256SUMS")"
          runuser -u builder -- env \
            EVKEY_SOURCE_ARCHIVE="$archive" \
            EVKEY_SOURCE_SHA256="$checksum" \
            makepkg --syncdeps --noconfirm --cleanbuild
          sha256sum ./*.pkg.tar.* > arch-SHA256SUMS
        working-directory: packaging/arch
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: |
            packaging/arch/*.pkg.tar.*
            packaging/arch/arch-SHA256SUMS
          if-no-files-found: error
